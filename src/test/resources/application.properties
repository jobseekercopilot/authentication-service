server.port=0
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.h2.console.enabled=false
jwt.expiration=900000
jwt.issuer=test-issuer
jwt.audience=test-audience
jwt.key-id=test-key
jwt.clock-skew-seconds=30
auth.session.refresh-lifetime=7d
auth.password-reset.token-lifetime=30m
auth.password-reset.request-cooldown=60s
auth.account-lifecycle.recent-authentication-age=15m
auth.account-lifecycle.token-lifetime=5m
auth.account-lifecycle.completed-operation-retention=365d
auth.account-lifecycle.user-profile-url=http://127.0.0.1:1
auth.account-lifecycle.application-tracker-url=http://127.0.0.1:1
auth.account-lifecycle.document-store-url=http://127.0.0.1:1
auth.account-lifecycle.connect-timeout=100ms
auth.account-lifecycle.read-timeout=100ms
auth.account-lifecycle.recovery-initial-delay=PT24H
auth.account-lifecycle.recovery-delay=PT24H
auth.account-email.delivery-mode=fixture
auth.account-email.application-base-url=http://localhost:4200
auth.account-email.fixture.maximum-messages=100
service.identity.token=test-only-authentication-service-token-32-bytes
service.identity.environment-data-token=test-only-environment-data-token-32-bytes
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http=INFO
