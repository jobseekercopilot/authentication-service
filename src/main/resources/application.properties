server.port=8084
spring.application.name=authentication-service

# Database configuration (H2 In-Memory)
spring.datasource.url=${AUTH_DB_URL:jdbc:h2:file:./data/auth-db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.settings.web-allow-others=true

# Hibernate / JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Custom Authentication Configs
jwt.signing-key=${JWT_SIGNING_KEY}
jwt.expiration=86400000

# Credential attack controls. Gateway/IP-level controls are owned by UMG-05.
auth.login.maximum-failures=${AUTH_LOGIN_MAXIMUM_FAILURES:10}
auth.login.attempt-window=${AUTH_LOGIN_ATTEMPT_WINDOW:15m}
auth.login.lock-duration=${AUTH_LOGIN_LOCK_DURATION:15m}
auth.login.maximum-tracked-principals=${AUTH_LOGIN_MAXIMUM_TRACKED_PRINCIPALS:10000}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n
logging.level.com.jobseekercopilot=${APP_LOG_LEVEL:INFO}
# Framework DEBUG logs can include request bodies and parser diagnostics.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http=INFO
