server.port=8084
spring.application.name=authentication-service
spring.profiles.default=local
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Flyway owns the schema in every environment; Hibernate may only validate it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Custom Authentication Configs
jwt.signing-key=${JWT_SIGNING_KEY}
jwt.expiration=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
jwt.issuer=${JWT_ISSUER:job-seeker-copilot-authentication}
jwt.audience=${JWT_AUDIENCE:job-seeker-copilot-services}
jwt.key-id=${JWT_KEY_ID:primary}
jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:30}
auth.session.refresh-lifetime=${AUTH_REFRESH_TOKEN_LIFETIME:7d}
service.identity.token=${AUTH_SERVICE_TOKEN}
service.identity.environment-data-token=${AUTH_ENVIRONMENT_DATA_TOKEN}

# Credential attack controls. Gateway/IP-level controls are owned by UMG-05.
auth.login.maximum-failures=${AUTH_LOGIN_MAXIMUM_FAILURES:10}
auth.login.attempt-window=${AUTH_LOGIN_ATTEMPT_WINDOW:15m}
auth.login.lock-duration=${AUTH_LOGIN_LOCK_DURATION:15m}
auth.login.maximum-tracked-principals=${AUTH_LOGIN_MAXIMUM_TRACKED_PRINCIPALS:10000}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n
logging.level.com.jobseekercopilot=${APP_LOG_LEVEL:INFO}
# Framework DEBUG logs can include request bodies and parser diagnostics.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http=INFO
