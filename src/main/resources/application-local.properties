# Direct local JVM runs use the same database engine as container/runtime paths.
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/authentication}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${AUTH_DB_USERNAME:authentication}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
